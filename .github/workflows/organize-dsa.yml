name: Organize NeetCode Submissions

on:
  push:
    branches:
      - main
    paths:
      - "Data Structures & Algorithms/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run DSA organizer
        run: python3 scripts/organize_dsa.py

      - name: Commit organized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "DSA Organized"

          if git diff --cached --quiet; then
            echo "No organized files changed."
          else
            git commit -m "Auto-organize NeetCode submissions"
            git push
          fi