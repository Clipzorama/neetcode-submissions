name: Organize NeetCode Submissions

on:
  push:
    branches:
      - main
    paths:
      - "Data Structures & Algorithms/**"
      - "scripts/organize_dsa.py"
      - "requirements-organizer.txt"
      - ".github/workflows/organize-dsa.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-neetcode-main
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-organizer.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-organizer.txt

      - name: Run DSA organizer
        run: python scripts/organize_dsa.py

      - name: Commit organized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all -- "DSA Organized" "scripts/problem_metadata.json"

          if git diff --cached --quiet; then
            echo "No organized files changed."
          else
            git commit -m "Auto-organize NeetCode submissions [skip ci]"
            git pull --rebase origin main
            git push
          fi
